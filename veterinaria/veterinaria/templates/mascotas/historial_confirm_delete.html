{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 720px;">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4>Eliminar entrada de historial</h4>
      <p>¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer.</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'mascotas:historial' object.mascota.pk %}" class="btn btn-secondary">Cancelar</a>
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
