{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-body">
    <h4>Eliminar Mascota</h4>
    <p>¿Seguro que deseas eliminar <b>{{ object.nombre }}</b>? Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Sí, eliminar</button>
      <a class="btn btn-secondary" href="{% url 'mascotas:listar' %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
